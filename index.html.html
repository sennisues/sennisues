<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sennis Birds</title>
<style>
:root{--bg:#0d2a1c;--fg:#f4ffd0;--ball:#d6f33a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a2016;--fg:#f4ffd0}}
:root[data-theme="dark"]{--bg:#0a2016;--fg:#f4ffd0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#dash{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:4px solid var(--fg);background:var(--ball);color:#0a2016;font:900 15px "Trebuchet MS",sans-serif;display:none}
@media (pointer:coarse){#dash,#pw{display:block}}
#pw{position:fixed;right:18px;bottom:calc(118px + env(safe-area-inset-bottom,0px));width:96px;height:52px;border-radius:26px;border:4px solid var(--fg);background:#14442b;color:var(--fg);font:900 12px "Trebuchet MS",sans-serif;display:none}
#name{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;padding:0 16px}
#name input{width:min(240px,55vw);font:700 18px "Trebuchet MS",sans-serif;padding:10px 14px;border-radius:12px;border:3px solid var(--fg);background:#0a2016;color:var(--fg);text-align:center;user-select:text;-webkit-user-select:text}
#name button{font:900 16px "Trebuchet MS",sans-serif;padding:10px 18px;border-radius:12px;border:3px solid var(--fg);background:var(--ball);color:#0a2016}
#adm{display:none;position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:178px;padding:8px;max-height:55vh;overflow-y:auto;touch-action:pan-y;border-radius:10px;background:rgba(6,20,13,.88);border:2px solid #b58cff;font-size:12px}
#adm .h{font-weight:900;color:#b58cff;cursor:pointer;margin-bottom:4px}
#adm.min>:not(.h){display:none}
#adm label{display:block;margin:2px 0}
#adm .h2{font-weight:900;color:#ff6bd6;margin-top:10px}
#adm select,#adm input[type=text]{box-sizing:border-box;width:100%;margin-top:4px;font-size:12px;background:#0a2016;color:var(--fg);border:1px solid var(--fg);border-radius:6px;padding:4px}
#adm .r{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
#lobby{position:fixed;inset:0;display:none;overflow:auto;background:rgba(6,20,13,.97);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px;touch-action:pan-y}
#lobby .w{max-width:460px;margin:0 auto}
#lobby h2{margin:6px 0 2px;font-size:28px}
#lobby .s{margin:16px 0 4px;font-size:14px;color:#9fe8ff;font-weight:900}
#lobby .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
#lobby button{font:900 14px "Trebuchet MS",sans-serif;padding:9px 14px;border-radius:10px;border:3px solid var(--fg);background:var(--ball);color:#0a2016}
#lobby button.g{background:#14442b;color:var(--fg)}
#lobby input{font:700 16px "Trebuchet MS",sans-serif;padding:8px 10px;border-radius:10px;border:3px solid var(--fg);background:#0a2016;color:var(--fg);width:110px;text-transform:uppercase;user-select:text;-webkit-user-select:text}
#lobby .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.08);margin:4px 0;font-size:14px}
#lobby .msg{color:#ffd27f;font-size:13px;margin:4px 0}
#adm button{font:700 11px sans-serif;padding:4px 6px;border-radius:6px;border:1px solid var(--fg);background:#14442b;color:var(--fg)}
</style></head><body>
<canvas id="c"></canvas>
<button id="dash">DASH</button>
<button id="pw">POWER</button>
<div id="name"><input id="nm" maxlength="16" autocomplete="off" placeholder="Name your bird"><button id="go">SERVE</button></div>
<div id="adm"><div class="h">ADMIN PANEL (tap to fold)</div>
<label><input type="checkbox" data-k="god"> God mode</label>
<label><input type="checkbox" data-k="dash"> Infinite dash</label>
<label><input type="checkbox" data-k="rapid"> Rapid fire</label>
<label><input type="checkbox" data-k="triple"> Triple shot</label>
<label><input type="checkbox" data-k="speed"> Super speed</label>
<label><input type="checkbox" data-k="giant"> Giant bird</label>
<label><input type="checkbox" data-k="freeze"> Freeze enemies</label>
<label><input type="checkbox" data-k="slow"> Slow-mo</label>
<div class="r"><button data-a="heal">Heal</button><button data-a="cure">Cure ink</button><button data-a="skip">Skip wave</button><button data-a="clear">Kill all</button><button data-a="pts">+1000</button><button data-a="swarm">Swarm x10</button><button data-a="w5">Wave +5</button><button data-a="proj">Clear shots</button><button data-a="pw">Random power</button></div>
<div class="r"><button data-s="0">Racket</button><button data-s="1">Mini</button><button data-s="2">Paddle</button><button data-s="3">Pigeon</button><button data-s="4">Squid</button></div>
<div class="h2">BROADCAST</div>
<select id="bt"><option value="all">All lobbies</option><option value="lobby">My lobby only</option></select>
<div class="r"><button data-b="storm">Pigeon storm</button><button data-b="flood">Ink flood</button><button data-b="swarm">Racket swarm</button><button data-b="boss">3 Paddles</button><button data-b="rain">Power rain</button><button data-b="freeze">Freeze all</button><button data-b="rage">Rage</button><button data-b="heal">Heal all</button><button data-b="shield">Shield all</button><button data-b="nuke">Nuke</button><button data-b="score">+500 all</button></div>
<select id="bp"><option value="nova">Fuzz Nova</option><option value="shield">Shield</option><option value="freeze">Time Freeze</option><option value="storm">Triple Storm</option><option value="boost">Turbo</option><option value="cure">Vaccine</option></select>
<div class="r"><button data-b="power">Give power to all</button></div>
<input id="bm" type="text" maxlength="60" placeholder="Announcement"><div class="r"><button data-b="msg">Announce</button></div></div>
<div id="lobby"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0;
function rs(){const d=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let best=0;try{best=+localStorage.getItem('sb_best')||0}catch(e){}
let state='title',P,E=[],B=[],F=[],D=[],I=[],score=0,wave=0,spawnLeft=0,spawnT=0,banner=0,shake=0,T=0,kills=0;
const keys={},adm={on:false,god:false,dash:false,rapid:false,freeze:false,slow:false,speed:false,triple:false,giant:false};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k==='e'||k==='q')usePower();if(k===' '||k==='enter'){e.preventDefault();act()}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let joy=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();joy={id:e.pointerId,x0:e.clientX-r.left,y0:e.clientY-r.top,x:e.clientX-r.left,y:e.clientY-r.top};if(state!=='play')act()});
cv.addEventListener('pointermove',e=>{if(joy&&joy.id===e.pointerId){const r=cv.getBoundingClientRect();joy.x=e.clientX-r.left;joy.y=e.clientY-r.top}});
const up=e=>{if(joy&&joy.id===e.pointerId)joy=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
document.getElementById('dash').addEventListener('pointerdown',e=>{e.stopPropagation();act()});
function act(){if(state==='over'){state='lobby';admEl.style.display='none';showLobby()}else if(state==='play')dash()}
function start(){P={x:W/2,y:H/2,vx:0,vy:0,r:18,hp:5,ink:0,inkT:0,pw:null,sh:0,tr:0,sp:0,inv:0,dashT:0,dashCD:0,fire:0,face:1,ix:1,iy:0};E=[];B=[];F=[];D=[];I=[];PK=[];fzT=0;bots=myKind==='bot'?[0,1,2].map(i=>({x:P.x,y:P.y,a:i*2.1,fire:Math.random()*.4,face:1,i})):[];score=0;wave=0;kills=0;nextWave();state='play'}
function nextWave(){wave++;P.ink=0;spawnLeft=4+wave*3;spawnT=1;banner=2;if(wave>1)P.hp=Math.min(5,P.hp+1)}
function inputVec(){let x=0,y=0;if(keys.a||keys.arrowleft)x--;if(keys.d||keys.arrowright)x++;if(keys.w||keys.arrowup)y--;if(keys.s||keys.arrowdown)y++;
if(joy){x=(joy.x-joy.x0)/45;y=(joy.y-joy.y0)/45}
const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return[x,y]}
function dash(){if(P.dashCD>0||P.dashT>0)return;let[x,y]=inputVec();let m=Math.hypot(x,y);if(m<.1){x=P.ix;y=P.iy;m=1}P.dx=x/m;P.dy=y/m;P.dashT=.18;P.dashCD=1.2;P.inv=Math.max(P.inv,.3);burst(P.x,P.y,8,'#fff')}
function burst(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*220;F.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,c})}}
function spawn(ft){const s=Math.floor(Math.random()*4),r=Math.random();let x,y;
if(s<2){x=Math.random()*W;y=s?H+30:-30}else{y=Math.random()*H;x=s==2?-30:W+30}
let t=ft!==undefined?ft:wave>=2&&Math.random()<.14?4:wave>=2&&Math.random()<.15?3:(wave>=3&&r<.12+wave*.01?2:(r<.45?1:0));if(t==3){x=Math.random()<.5?-30:W+30;y=60+Math.random()*H*.5}
const D=[{r:16,hp:2,sp:85+wave*5,pts:10,c:'#ff5a4d'},{r:11,hp:1,sp:150+wave*4,pts:15,c:'#b06bff'},{r:26,hp:8,sp:55+wave*2,pts:50,c:'#3fb6ff'},{r:14,hp:2,sp:150+wave*3,pts:25,c:'#8d97ab'},{r:17,hp:3,sp:70+wave*2,pts:30,c:'#4a2a8a'}][t];
E.push({x,y,t,dir:x<0?1:-1,r:D.r,hp:D.hp,mhp:D.hp,sp:D.sp,pts:D.pts,c:D.c,hit:0,a:0})}
function infect(){if(adm.god||P.sh>0)return;P.ink=8;if(P.inkT<=0)P.inkT=2.5}
function die(){state='over';if(score>best){best=score;try{localStorage.setItem('sb_best',best)}catch(e){}}}
function hurt(e){if(adm.god||P.sh>0)return;P.hp--;P.inv=1.1;shake=.3;const a=Math.atan2(P.y-e.y,P.x-e.x);P.vx=Math.cos(a)*420;P.vy=Math.sin(a)*420;burst(P.x,P.y,12,'#e6ff3a');if(P.hp<=0){state='over';if(score>best){best=score;try{localStorage.setItem('sb_best',best)}catch(e){}}}}
function kill(e){score+=e.pts*Math.max(1,wave>4?2:1);kills++;burst(e.x,e.y,e.t==2?24:12,e.c);shake=Math.max(shake,e.t==2?.3:.1);if(Math.random()<(e.t==2?.6:.14))drop(e.x,e.y);E.splice(E.indexOf(e),1)}
function update(dt){
T+=dt;if(banner>0)banner-=dt;if(shake>0)shake-=dt;
for(const f of F){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.95;f.vy*=.95;f.l-=dt}F=F.filter(f=>f.l>0);
if(state!=='play')return;
P.inv-=dt;P.dashCD-=dt;if(adm.dash)P.dashCD=0;if(adm.god)P.ink=0;P.r=adm.giant?34:18;P.sh-=dt;P.tr-=dt;P.sp-=dt;fzT-=dt;adminMsgT-=dt;
if(P.ink>0){P.ink-=dt;P.inkT-=dt;if(Math.random()<dt*12)F.push({x:P.x+(Math.random()-.5)*20,y:P.y+8,vx:0,vy:40,l:.6,c:'#2a1450'});if(P.inkT<=0){P.inkT=2.5;P.hp--;shake=.2;burst(P.x,P.y,6,'#2a1450');if(P.hp<=0)die()}}
const[ix,iy]=inputVec();
if(Math.hypot(ix,iy)>.1){P.ix=ix;P.iy=iy;if(Math.abs(ix)>.2)P.face=ix>0?1:-1}
if(P.dashT>0){P.dashT-=dt;P.vx=P.dx*720;P.vy=P.dy*720;if(Math.random()<.7)F.push({x:P.x,y:P.y,vx:0,vy:0,l:.25,c:'#d6f33a'})}
else{const SPD=(adm.speed||P.sp>0)?420:235;P.vx+=(ix*SPD-P.vx)*Math.min(1,dt*10);P.vy+=(iy*SPD-P.vy)*Math.min(1,dt*10)}
P.x=Math.max(P.r,Math.min(W-P.r,P.x+P.vx*dt));P.y=Math.max(P.r,Math.min(H-P.r,P.y+P.vy*dt));
// auto-fire fuzz shots at nearest enemy
P.fire-=dt;
if(P.fire<=0&&E.length){let n=null,d=1e9;for(const e of E){const q=Math.hypot(e.x-P.x,e.y-P.y);if(q<d){d=q;n=e}}
const a=Math.atan2(n.y-P.y,n.x-P.x);for(const o of (adm.triple||P.tr>0)?[-.25,0,.25]:[0])B.push({x:P.x,y:P.y,vx:Math.cos(a+o)*540,vy:Math.sin(a+o)*540,l:1.2});P.fire=adm.rapid?.05:.2;if(Math.abs(Math.cos(a))>.3)P.face=Math.cos(a)>0?1:-1}
for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
for(const e of E){if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){e.hp--;e.hit=.1;b.l=0;e.x+=b.vx*.02;e.y+=b.vy*.02;burst(b.x,b.y,2,'#e6ff3a');if(e.hp<=0)kill(e);break}}}
B=B.filter(b=>b.l>0);
for(const d of D){d.vy+=260*dt;d.y+=d.vy*dt;d.l-=dt;if(Math.hypot(d.x-P.x,d.y-P.y)<P.r+6&&P.inv<=0&&P.dashT<=0){d.l=0;hurt({x:d.x,y:d.y-20})}if(d.y>H-10){d.l=0;burst(d.x,d.y,4,'#fff')}}D=D.filter(d=>d.l>0);
for(const b of I){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(Math.hypot(b.x-P.x,b.y-P.y)<P.r+7&&b.l>0){b.l=0;if(P.dashT<=0){infect();burst(P.x,P.y,8,'#2a1450')}}for(const q of B)if(Math.hypot(b.x-q.x,b.y-q.y)<10){b.l=0;q.l=0;burst(b.x,b.y,4,'#2a1450')}}I=I.filter(b=>b.l>0);
for(const k of PK){k.l-=dt;if(!P.pw&&Math.hypot(k.x-P.x,k.y-P.y)<P.r+14){P.pw=k.k;k.l=0;burst(k.x,k.y,8,PW[k.k].c)}}PK=PK.filter(k=>k.l>0);
for(const b of bots){const tx=P.x+Math.cos(b.a+T*.9)*75,ty=P.y+Math.sin(b.a+T*.9)*75;b.x+=(tx-b.x)*Math.min(1,dt*4);b.y+=(ty-b.y)*Math.min(1,dt*4);b.fire-=dt;if(b.fire<=0&&E.length){let n=null,d=1e9;for(const e of E){const q=Math.hypot(e.x-b.x,e.y-b.y);if(q<d){d=q;n=e}}const an=Math.atan2(n.y-b.y,n.x-b.x);B.push({x:b.x,y:b.y,vx:Math.cos(an)*520,vy:Math.sin(an)*520,l:1});b.fire=.45;b.face=Math.cos(an)>0?1:-1}}
// spawning
if(spawnLeft>0){spawnT-=dt;if(spawnT<=0){spawn();spawnLeft--;spawnT=Math.max(.25,1-wave*.06)}}
else if(!E.length)nextWave();
for(const e of E.slice()){
if(e.t==3){e.hit-=dt;e.x+=(adm.freeze||fzT>0)?0:e.dir*e.sp*dt;e.y+=Math.sin(T*4+e.x*.01)*40*dt;e.dr=(e.dr||.6)-((adm.freeze||fzT>0)?0:dt);if(e.dr<=0&&e.x>0&&e.x<W){e.dr=.9;D.push({x:e.x,y:e.y+10,vy:60,l:3})}if(e.x<-60||e.x>W+60)E.splice(E.indexOf(e),1);continue}
const a=Math.atan2(P.y-e.y,P.x-e.x);e.a=a;e.hit-=dt;const dd=Math.hypot(P.x-e.x,P.y-e.y);let sg=1;if(e.t==4){sg=dd>210?1:dd<150?-1:0;e.ft=(e.ft||1.5)-((adm.freeze||fzT>0)?0:dt);if(e.ft<=0){e.ft=2.2;I.push({x:e.x,y:e.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190,l:3})}}if(!(adm.freeze||fzT>0)){e.x+=Math.cos(a)*e.sp*dt*sg;e.y+=Math.sin(a)*e.sp*dt*sg}
if(Math.hypot(P.x-e.x,P.y-e.y)<e.r+P.r-3){
if(P.dashT>0){e.hp-=3;e.hit=.15;e.x+=Math.cos(P.vy,P.vx)*0;burst(e.x,e.y,6,'#fff');if(e.hp<=0)kill(e)}
else if(P.inv<=0){if(e.t==4){infect();P.inv=.8;burst(P.x,P.y,8,'#2a1450')}else hurt(e)}}}
}
// ---- drawing ----
function court(){
ctx.fillStyle='#14442b';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(244,255,208,.22)';ctx.lineWidth=3;
const m=28;ctx.strokeRect(m,m,W-2*m,H-2*m);ctx.beginPath();ctx.moveTo(W/2,m);ctx.lineTo(W/2,H-m);ctx.moveTo(m,H/2);ctx.lineTo(W-m,H/2);ctx.stroke();
ctx.beginPath();ctx.arc(W/2,H/2,Math.min(W,H)*.18,0,6.28);ctx.stroke()}
function bird(x,y,r,face,sq,flash){
ctx.save();ctx.translate(x,y);ctx.scale(face*(1+sq),1-sq);
ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,r*.95,r*.9,r*.28,0,0,6.28);ctx.fill();
const g=ctx.createRadialGradient(-r*.3,-r*.4,r*.1,0,0,r*1.1);g.addColorStop(0,'#f2ff5a');g.addColorStop(1,'#a9d61c');
ctx.fillStyle=flash?'#fff':g;ctx.beginPath();ctx.arc(0,0,r,0,6.28);ctx.fill();
ctx.strokeStyle='rgba(255,255,240,.8)';ctx.lineWidth=r*.12;ctx.beginPath();ctx.arc(-r*1.15,0,r*1.0,-.9,.9);ctx.stroke();
ctx.beginPath();ctx.arc(r*1.3,r*.2,r*1.0,2.5,3.8);ctx.stroke();
ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(r*.38,-r*.2,r*.14,r*.17,0,0,6.28);ctx.fill();
ctx.strokeStyle='#111';ctx.lineWidth=r*.1;ctx.beginPath();ctx.moveTo(r*.15,-r*.5);ctx.lineTo(r*.65,-r*.32);ctx.stroke();
ctx.fillStyle='#8a6b55';ctx.beginPath();ctx.moveTo(r*.65,-r*.02);ctx.lineTo(r*1.4,r*.2);ctx.lineTo(r*.65,r*.34);ctx.closePath();ctx.fill();
ctx.restore()}
function racket(e){
ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.a);
const w=e.hit>0;ctx.strokeStyle=w?'#fff':e.c;ctx.lineWidth=e.t==2?7:4;
ctx.beginPath();ctx.moveTo(-e.r,0);ctx.lineTo(-e.r-e.r*.9,0);ctx.stroke();
ctx.lineWidth=e.t==2?3:2;
if(e.t==2){ctx.fillStyle=w?'#fff':e.c;ctx.beginPath();ctx.arc(0,0,e.r,0,6.28);ctx.fill();ctx.fillStyle='rgba(0,0,0,.35)';for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)if(i*i+j*j<5){ctx.beginPath();ctx.arc(i*8,j*8,2,0,6.28);ctx.fill()}}
else{ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.ellipse(0,0,e.r*1.1,e.r*.85,0,0,6.28);ctx.fill();ctx.stroke();
ctx.lineWidth=1;ctx.globalAlpha=.6;ctx.beginPath();for(let i=-2;i<=2;i++){ctx.moveTo(-e.r*.8,i*e.r*.3);ctx.lineTo(e.r*.8,i*e.r*.3);ctx.moveTo(i*e.r*.35,-e.r*.7);ctx.lineTo(i*e.r*.35,e.r*.7)}ctx.stroke();ctx.globalAlpha=1}
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.r*.3,-e.r*.28,3,0,6.28);ctx.arc(e.r*.3,e.r*.28,3,0,6.28);ctx.fill();
ctx.fillStyle='#111';ctx.beginPath();ctx.arc(e.r*.36,-e.r*.28,1.6,0,6.28);ctx.arc(e.r*.36,e.r*.28,1.6,0,6.28);ctx.fill();
ctx.restore();
if(e.mhp>2){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(e.x-18,e.y-e.r-12,36,4);ctx.fillStyle='#e6ff3a';ctx.fillRect(e.x-18,e.y-e.r-12,36*e.hp/e.mhp,4)}}
